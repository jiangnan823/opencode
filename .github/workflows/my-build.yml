name: Build CLI

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "先合并 anomaly/dev 再构建"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync & bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/agent-bypass-mode-devsync
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge anomaly/dev
        if: inputs.sync_upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add anomaly https://github.com/anomalyco/opencode.git
          git fetch anomaly dev

          if git merge --no-ff -m "chore: merge anomaly/dev" anomaly/dev; then
            echo "Clean merge."
            exit 0
          fi

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          echo "Conflicts:"
          echo "$CONFLICTS"
          NON_PKG=$(echo "$CONFLICTS" | grep -v -E '(^|/)package\.json$' || true)

          if [ -n "$NON_PKG" ]; then
            echo "Non-package.json conflicts found, aborting:"
            echo "$NON_PKG"
            git merge --abort
            gh label create upstream-sync --color FBCA04 --force || true
            BODY=$(printf "冲突文件：\n\n\`\`\`\n%s\n\`\`\`\n\n其中非 package.json 文件需要手动解决。请本地 merge 后推送到 \`custom/agent-bypass-mode-devsync\`。" "$CONFLICTS")
            gh issue create \
              --title "❌ 合并 anomaly/dev 有代码冲突，需要手动解决" \
              --body "$BODY" \
              --label upstream-sync
            exit 1
          fi

          echo "Only package.json conflicts — accepting upstream versions."
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git checkout --theirs "$f"
            git add "$f"
          done <<< "$CONFLICTS"
          git commit -m "chore: merge anomaly/dev (auto-resolved version conflicts)"

      - name: Bump -T version
        id: ver
        run: |
          cd packages/opencode
          BASE=$(node -p "require('./package.json').version.replace(/-T.*$/,'')")
          NEW="${BASE}-T"
          node -e "const f='./package.json';const p=require(f);p.version='${NEW}';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          git add package.json
          git commit -m "chore: bump version to ${NEW}" || echo "no version change to commit"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push merged branch
        if: inputs.sync_upstream
        run: git push origin HEAD:custom/agent-bypass-mode-devsync

  build:
    name: Build ${{ matrix.target }}
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            archive_shell: bash
          - os: windows-2022
            target: windows-x64
            archive_shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun

      - name: Build single target
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.sync.outputs.version }}
        shell: bash
        run: bun run script/build.ts --single

      - name: Zip binary (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/opencode/dist
        run: |
          cd opencode-${{ matrix.target }}/bin
          zip -r ../../opencode-${{ matrix.target }}.zip *

      - name: Zip binary (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/opencode/dist
        shell: pwsh
        run: Compress-Archive -Path "opencode-${{ matrix.target }}/bin/*" -DestinationPath "opencode-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.target }}
          path: packages/opencode/dist/opencode-${{ matrix.target }}.zip
          retention-days: 7

  release:
    name: Release
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.zip" -exec cp {} dist/ \;
          ls -la dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
